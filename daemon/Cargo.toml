[package]
name = "zed-remote-daemon"
version = "0.1.6"
edition = "2021"
authors = ["Zed Remote Contributors"]
description = "High-performance Rust host daemon proxying Zed ACP streams and providing mobile remote control."
readme = "README.md"
license = "MIT"

[workspace]

[dependencies]
# Asynchronous Runtime & I/O
tokio = { version = "1.38", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# WebSocket Server & Networking
tokio-tungstenite = "0.23"

# Serialization & JSON-RPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# System Telemetry & Process Info
sysinfo = "0.30"

# Security & Cryptography
subtle = "2.5"

# Error Handling & Utilities
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
