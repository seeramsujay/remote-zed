---
name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Native Android APK (Material 3 Jetpack Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Compose Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Android Compose APK artifact
        run: |
          mkdir -p dist
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_FILE" dist/zed-remote.apk

      - name: Upload Android Compose APK
        uses: actions/upload-artifact@v4
        with:
          name: zed-remote-apk
          path: dist/zed-remote.apk

  build-daemon:
    name: Build Host Daemon (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Build daemon release binary
        run: |
          cd daemon
          cargo build --release

      - name: Package daemon binary
        run: |
          mkdir -p dist
          cp daemon/target/release/zed-remote-daemon dist/
          cd dist
          tar -czvf zed-remote-daemon-linux-x86_64.tar.gz zed-remote-daemon
          rm zed-remote-daemon

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-remote-daemon-linux
          path: dist/zed-remote-daemon-linux-x86_64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-daemon]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Compose APK
        uses: actions/download-artifact@v4
        with:
          name: zed-remote-apk
          path: release-artifacts

      - name: Download Linux Daemon
        uses: actions/download-artifact@v4
        with:
          name: zed-remote-daemon-linux
          path: release-artifacts

      - name: Copy Tunnel & Injector Scripts
        run: |
          cp tools/bunker-tunnel.sh release-artifacts/
          cp tools/inject-daemon.sh release-artifacts/

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Zed Remote ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/zed-remote.apk
            release-artifacts/zed-remote-daemon-linux-x86_64.tar.gz
            release-artifacts/bunker-tunnel.sh
            release-artifacts/inject-daemon.sh
