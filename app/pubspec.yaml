name: zed_remote_app
description: "Mobile companion application for Zed Remote controlling ACP AI agents and Git workflows."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Networking & WebSockets
  web_socket_channel: ^3.0.3
  http: ^1.2.0

  # State Management
  provider: ^6.1.2

  # Cryptography (Bunker tunnel AES-GCM)
  cryptography: ^2.9.0

  # UI & Markdown
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
