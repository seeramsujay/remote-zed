name: zed_remote_app
description: "Mobile companion application for Zed Remote controlling ACP AI agents and Git workflows."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & WebSockets
  web_socket_channel: ^2.4.1
  http: ^1.2.0

  # ACP Protocol Integration
  acp_dart: ^0.1.0

  # State Management
  provider: ^6.1.2

  # UI & Markdown
  flutter_markdown: ^0.6.18+3
  intl: ^0.19.0
  google_fonts: ^6.1.0
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
